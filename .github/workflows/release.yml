name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Build and package
        run: |
          MARKETING_VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" Scripts/package-app.sh .build/HiveSqueueMenu.app
          ditto -c -k --sequesterRsrc --keepParent .build/HiveSqueueMenu.app .build/HiveSqueueMenu.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .build/HiveSqueueMenu.zip --generate-notes --verify-tag
